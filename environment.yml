name: pvr_torch
channels:
  - conda-forge
dependencies:
  # ── System / toolchain: what conda is actually buying you over venv ────────
  - python=3.11
  - pip
  - setuptools                   # CLIP / R3M / VIP are setup.py installs
  - wheel
  - git                          # required by the git+https requirements below
  - ffmpeg                       # RecordVideo / moviepy backend
  - swig                         # box2d-py builds from source and needs it

  - pip:
    # ── Core ML ────────────────────────────────────────────────────────────────
    # CPU-only wheels are installed by default here.
    # For CUDA support, activate the env then run:
    #   pip install torch==2.12.1 torchvision==0.27.1 --index-url https://download.pytorch.org/whl/cu124
    - torch==2.12.1
    - torchvision==0.27.1

    # ── Environments ───────────────────────────────────────────────────────────
    - gymnasium==1.3.0
    - gymnasium-robotics==1.4.2    # includes FrankaKitchen-v1, Adroit, Fetch
    - minigrid==3.1.0              # MiniGrid
    - ale-py==0.12.0                # Atari
    - shimmy[dm-control]==2.0.1     # DMC → gymnasium bridge
    - mujoco==3.8.1                 # pinned: 3.9+ breaks dm_control 1.0.41
    - opencv-python-headless==5.0.0.93  # needed by ResizeObservation wrapper
    - box2d-py==2.3.5               # CarRacing-v3, needs conda `swig` above
    - pygame>=2.6                   # box2d/classic-control rendering

    # ── Vision models ──────────────────────────────────────────────────────────
    - timm==1.0.25
    - git+https://github.com/openai/CLIP.git
    - open_clip_torch==3.3.0
    - git+https://github.com/facebookresearch/r3m.git
    - git+https://github.com/facebookresearch/vip.git
    - gdown                         # R3M/VIP pull checkpoints from Google Drive
    # LIV embedding only — two-step install, doesn't fit a single pip line,
    # install separately if needed:
    #   pip install git+https://github.com/penn-pal-lab/LIV.git
    #   (then, from the cloned repo) cd liv/models/clip && pip install -e .
    # MaskRCNN embedding only — large build, install separately if needed:
    # - git+https://github.com/facebookresearch/detectron2.git

    # ── RL backend / experiment tracking ────────────────────────────────────────
    - stable_baselines3==2.9.0
    - wandb==0.25.0
    - tensorboard==2.20.0
    - protobuf==5.27.2          # tensorboard/wandb both depend on this; pinned
                                # explicitly to avoid the two resolving to
                                # incompatible versions

    # ── Offline RL datasets ────────────────────────────────────────────────────
    - minari==0.5.3

    # ── Config & experiment management ─────────────────────────────────────────
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - hydra-submitit-launcher==1.2.0
    - submitit==1.5.4

    # ── Utils ──────────────────────────────────────────────────────────────────
    - numpy==2.4.4
    - Pillow==12.2.0
    - tqdm==4.68.1
    - pandas==3.0.3
    - matplotlib==3.10.8
    - seaborn==0.13.2
    - moviepy>=2.0
    - GitPython==3.1.46
    - ipykernel                     # for Open OnDemand Jupyter against this env
