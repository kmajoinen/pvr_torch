# DQN for train_discrete.py (src/rl/discrete.py): double DQN on n-step
# targets, Huber loss, epsilon-greedy exploration annealed linearly.
name: dqn
total_timesteps: 500_000
buffer_size: 1_000_000
buffer_compression: none      # none | zstd | lz4 | zlib: lossless per-frame compression of pixel
                              #   buffers (~3-5x at 224px); zstd needs `pip install zstandard`,
                              #   lz4 `pip install lz4`; zlib is built in but slower to decode
buffer_compression_level: null  # codec level (null: zstd 3, lz4 0, zlib 1)
buffer_decode_threads: 8      # threads reading/decompressing sampled batches (in the background)
buffer_storage: ram           # ram | disk: frames (or the compressed arena) in a memory-mapped
                              #   file on a local disk; the page cache holds what fits in --mem
buffer_dir: null              # disk: its folder (null: /tmp/$SLURM_JOB_ID, the node's local disk;
                              #   needs --tmp / a local-disk node)
buffer_max_gb: null           # cap on compressed storage: the buffer stops growing there
learning_starts: 5000         # uniform random actions, no updates, until here
batch_size: 256
gamma: 0.99
nstep: 3                      # n-step returns (never cross an episode end)
action_repeat: 1
train_frequency: 1            # an update every N env steps
gradient_steps: 1             # updates each time
lr: 1.0e-4
betas: [0.9, 0.999]
grad_clip: 10.0
net_arch: [256, 256]
double: true                  # false: plain DQN (the target network picks and values)
loss: huber                   # huber | mse
tau: 1.0                      # target update: 1.0 = hard copy, < 1 = Polyak
target_network_frequency: 1000
epsilon:                      # exploration: linear from start to end over the first fraction of total_timesteps
  start: 1.0
  end: 0.05
  fraction: 0.2
eval_epsilon: 0.05            # > 0: a second evaluation, epsilon-greedy (eval_eps/*); 0 = greedy only
log_frequency: 1000
eval_frequency: 10_000
n_episodes_test: 50           # the same 50 episodes (fixed reset seeds) every evaluation
