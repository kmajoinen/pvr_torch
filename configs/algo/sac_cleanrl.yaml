name: sac_cleanrl
total_timesteps: 500_000
buffer_size: 1_000_000
buffer_compression: none      # none | zstd | lz4 | zlib: lossless per-frame compression of pixel
                              #   buffers (~3-5x at 224px); zstd needs `pip install zstandard`,
                              #   lz4 `pip install lz4`; zlib is built in but slower to decode
buffer_compression_level: null  # codec level (null: zstd 3, lz4 0, zlib 1)
buffer_decode_threads: 8      # threads decompressing sampled batches (in the background)
buffer_max_gb: null           # cap on compressed storage: the buffer stops growing there
learning_starts: 5000
batch_size: 256
gamma: 0.99
nstep: 1                      # n-step returns (never cross an episode end)
action_repeat: 1              # env frames per agent step (rewards summed);
                              # total_timesteps etc. count agent steps
tau: 0.005                    # polyak coefficient for target critics
policy_lr: 3.0e-4
q_lr: 1.0e-3
alpha_lr: 1.0e-3              # temperature optimizer LR (autotune_alpha only).
                               # Previously silently reused q_lr; now independent.
policy_betas: [0.9, 0.999]    # Adam (beta1, beta2) for the actor optimizer
q_betas: [0.9, 0.999]         # Adam (beta1, beta2) for the critic optimizer
alpha_betas: [0.9, 0.999]     # Adam (beta1, beta2) for the temperature optimizer.
                               # Some implementations use beta1=0.5 here.
grad_clip: 10.0                # grad-norm clip on qf1+qf2 (critic step) and actor
                               # separately -- unlike finetune.grad_clip (encoder
                               # only), this applies in every mode (state/frozen/
                               # finetune), since the critic itself was previously
                               # never clipped at all.
policy_frequency: 2           # actor updated every N critic updates (then N times)
target_network_frequency: 1
alpha: 0.2                    # entropy coefficient (ignored if autotune_alpha)
autotune_alpha: true
net_arch: [256, 256]
log_frequency: 1000           # steps between wandb/stdout training logs
eval_frequency: 10_000
n_episodes_test: 5
