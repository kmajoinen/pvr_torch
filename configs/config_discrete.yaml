# train_discrete.py: config_sac.yaml (env, embedding, encoder.*, augmentation,
# buffer_obs, wandb, ...) with a discrete-action agent: algo=dqn (default) or
# algo=sac_discrete.
defaults:
  - config_sac
  - override env: fourrooms_pixels
  - override algo: dqn
  - _self_

hydra:
  run:
    dir: outputs/discrete/${algo.name}/${env.name}/${embedding.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/discrete_multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${algo.name}_${embedding.name}_seed${seed}
