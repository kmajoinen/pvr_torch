defaults:
  - env: dm_control_pixels
  - algo: sac_cleanrl
  - embedding: resnet50
  - augmentation: none     # configs/augmentation/*.yaml
  - _self_

config_version: 2          # 2: finetune.* replaced by encoder.* + buffer_obs

# The encoder trains (gets an optimizer) iff grads != none or aux is non-empty.
encoder:
  grads: none              # none | critic | actor | both -- which RL losses
                           #   backprop into the encoder
  lr: 1.0e-5               # separate encoder LR, well below q_lr/policy_lr
  betas: [0.9, 0.999]      # Adam (beta1, beta2) for the encoder optimizer
  grad_clip: 10.0          # clip norm on encoder gradients before each step
  trainable: all           # all | head -- head trains only embedding.head=linear,
                           #   on a frozen backbone (PIE-G)
  bn: frozen               # frozen | adapt -- adapt: BatchNorm uses each replay
                           #   batch's statistics and updates its running ones
                           #   during updates, running ones when acting (PIE-G)
  aux: []                  # aux losses (src/losses.py), e.g.
                           #   'encoder.aux=[{name:l2sp,weight:1.0}]'

buffer_obs: auto           # auto | features | pixels
                           #   auto     pixels if the encoder trains or augmentation
                           #            is on, else features (encoded once per env step)
                           #   pixels   always; with a frozen encoder and no
                           #            augmentation this is "slow-frozen"
                           #   features error if pixels are needed
# Pixels in the buffer cost buffer_size * H * W * 3 bytes (printed at
# startup) -- shrink env.image_size (e.g. 112 or 84) and/or algo.buffer_size.


seed: 1
device: cuda             # set to cpu if no GPU

obs_norm: null           # null -> auto (LayerNorm iff embedding set). Override
                          # to true/false to force actor/critic input LayerNorm
                          # on or off regardless of mode -- e.g. obs_norm=false
                          # on a pixel/PVR run, to test whether the July
                          # LayerNorm fix helps or hurts there too.

model_dir: null          # if set, embedding checkpoints are looked up here
                          # first (matched by filename minus extension, e.g.
                          # resnet18.pth) -- crashes if set but no matching
                          # file is found. Useful when checkpoints live on a
                          # different filesystem than the code (e.g. scratch
                          # vs projappl on the cluster).

save:
  enabled: true          # best_actor.pt on new best eval + final_checkpoint.pt

wandb:
  enabled: false
  project: pvr_torch
  entity: majoinen-karri
  run_name: null         # auto-generated if null

perf:
  tf32: true             # Hopper/GH200 reduced-precision matmul/conv
  cudnn_benchmark: true
  amp_bf16: true         # bf16 autocast for frozen-encoder inference
  compile_encoder: false # torch.compile the frozen encoder (try once stable)

hydra:
  job:
    chdir: true
  run:
    dir: outputs/sac/${env.name}/${embedding.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/sac_multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${embedding.name}_seed${seed}
