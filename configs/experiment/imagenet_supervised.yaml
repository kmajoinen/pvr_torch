# @package _global_
# Supervised ImageNet classification, torchvision's reference ResNet recipe
# (the one its V1 ResNet weights were trained with): 90 epochs, SGD (momentum
# 0.9, weight decay 1e-4), lr 0.1 per 256 images, divided by 10 every 30
# epochs; random resized crop + horizontal flip; validation at 256 -> 224
# center crop. Trains from scratch. Goyal et al.'s variant also drops at 80:
# lr_schedule.milestones=[30,60,80].
#   python pretrain.py +experiment=imagenet_supervised pretrain_data.root=/path/to/imagenet
#   python pretrain.py +experiment=imagenet_supervised embedding=resnet18 ...
defaults:
  - override /embedding: resnet50
  - override /pretrain_data: imagenet
  - override /augmentation: horizontal_flip

embedding:
  pretrained: false

objectives:
  - {name: supervised, weight: 1.0, num_classes: 1000}

batch_size: 256
epochs: 90
optimizer: sgd
lr: 0.1
lr_reference_batch: 256
momentum: 0.9
weight_decay: 1.0e-4
lr_schedule: {name: step, milestones: [30, 60], gamma: 0.1}
eval_every_epochs: 1
save:
  keep_every: null
  keep_every_epochs: 30
num_workers: 16
log_frequency: 500
