# @package _global_
# MAE (He et al., 2022) for pretrain.py, the official ImageNet pretraining
# recipe (facebookresearch/mae, PRETRAIN.md and main_pretrain.py): a ViT-B/16
# from scratch, mask ratio 0.75, per-patch normalised targets, a 512-wide
# 8-block decoder; AdamW (betas 0.9, 0.95), weight decay 0.05 (none on biases
# and norm weights), lr 1.5e-4 per 256 images, 40 warmup epochs then a half
# cosine to 0 (updated every step), 800 epochs; random resized crop (scale
# 0.2-1, bicubic) and horizontal flip. The official batch is 4096 across
# GPUs; here batch_size is one GPU's, and the lr scales with it. Video
# frames instead of ImageNet: +experiment=mvp.
#   python pretrain.py +experiment=mae pretrain_data.root=/path/to/imagenet
#   python pretrain.py +experiment=mae embedding=vit_s16 epochs=100 ...
defaults:
  - override /embedding: vit_b16
  - override /pretrain_data: imagenet
  - override /augmentation: horizontal_flip

objectives:
  - {name: mae, weight: 1.0, mask_ratio: 0.75, norm_pix_loss: true,
     decoder_dim: 512, decoder_depth: 8, decoder_heads: 16}

pretrain_data:
  train_crop:
    scale: [0.2, 1.0]
  interpolation: bicubic
  eval_batches: 20      # validation = reconstruction loss on 20 batches

batch_size: 256
epochs: 800
optimizer: adamw
lr: 1.5e-4
lr_reference_batch: 256
betas: [0.9, 0.95]
weight_decay: 0.05
no_weight_decay_1d: true
lr_schedule: {name: warmup_cosine, warmup: 40}
eval_every_epochs: 1
save:
  keep_every: null
  keep_every_epochs: 100
num_workers: 16
log_frequency: 500
perf:
  amp_bf16: true        # the official code trains in fp16 autocast
