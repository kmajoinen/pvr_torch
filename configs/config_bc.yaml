defaults:
  - dataset: door_expert
  - algo: bc
  - embedding: none
  - augmentation: none     # configs/augmentation/*.yaml
  - _self_

config_version: 2          # 2: finetune.* replaced by encoder.*

seed: 1
device: cuda                # set to cpu if no GPU
hidden_size: 1024
batch_norm: false

model_dir: null              # if set, embedding checkpoints are looked up here
                              # first (matched by filename minus extension, e.g.
                              # resnet18.pth) -- crashes if set but no matching
                              # file is found. Useful when checkpoints live on a
                              # different filesystem than the code (e.g. scratch
                              # vs projappl on the cluster).

# The encoder trains (gets an optimizer) iff grads != none or aux is non-empty.
encoder:
  grads: none              # none | policy -- whether the BC loss backprops
                           #   into the encoder
  lr: 1.0e-5               # separate encoder LR, well below algo.learning_rate
  betas: [0.9, 0.999]      # Adam (beta1, beta2) for the encoder optimizer
  grad_clip: 1.0           # clip norm on encoder gradients before each step
                           #   (null: no clipping)
  trainable: all           # all | head -- head trains only embedding.head=linear,
                           #   on a frozen backbone
  bn: frozen               # frozen | adapt -- adapt: BatchNorm uses each training
                           #   batch's statistics and updates its running ones;
                           #   validation/eval use the running ones
  aux: []                  # aux losses (src/losses.py), e.g.
                           #   'encoder.aux=[{name:l2sp,weight:1.0}]'

save:
  enabled: true          # best_policy.pt on new best val loss

wandb:
  enabled: false
  project: pvr_torch
  entity: majoinen-karri              # your wandb username or team
  run_name: test            # auto-generated if null

hydra:
  run:
    dir: outputs/bc/${dataset.id}/${embedding.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/bc_multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${embedding.name}_seed${seed}
