# train_xqc.py: config_sac.yaml (env, embedding, encoder.*, augmentation,
# buffer_obs, wandb, ...) with the XQC agent. obs_norm doesn't apply: XQC's
# networks start with their own BatchNorm.
defaults:
  - config_sac
  - override algo: xqc
  - _self_

hydra:
  run:
    dir: outputs/xqc/${env.name}/${embedding.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/xqc_multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${embedding.name}_seed${seed}
