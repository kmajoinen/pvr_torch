# EPIC-KITCHENS-100's frames as an image dataset (MAE/MVP, MoCo): the frame
# shards src/data/prepare_epic.py wrote for pretrain_data=epic, read as
# unlabelled images -- no separate conversion. At the default 10 fps, every
# 10th frame of each video is 1 fps: about 0.27M training frames from
# EPIC-100's 75 h of training videos (estimate; the training run prints the
# count).
name: epic_frames
type: images
root: ???                         # the --out folder of prepare_epic.py (as for pretrain_data=epic)
train_split: train
val_split: validation
image_size: 224                   # crop size fed to the encoder (frames are stored at 224)
every: 10                         # frames 1, 11, 21, ... of each training video (1 fps at 10 fps)
val_every: 50                     # validation: every 50th
train_crop:                       # RandomResizedCrop per view, in the loader workers
  scale: [0.2, 1.0]
  ratio: [0.75, 1.3333333333333333]
interpolation: bilinear           # bilinear | bicubic (MAE)
eval_resize: 256                  # validation: resize the short side, then center-crop image_size
eval_batches: 20                  # validation batches (null: the whole thinned split)
